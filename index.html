<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- ไอคอนของ "แอป" (TidTam) — คนละส่วนกับโลโก้บริษัทที่ตั้งจากหน้า "ตั้งค่าองค์กร" โดยสิ้นเชิง
         ⚠️ ต้องมี ?v= ต่อท้ายและเลื่อนเลขทุกครั้งที่เปลี่ยนรูป ให้ตรงกับใน manifest.json —
         ไม่งั้นเบราว์เซอร์หยิบไอคอนเดิมจากแคชมาใช้ แล้วผู้ใช้จะยังเห็นของเก่าอยู่นาน -->
    <link rel="icon" href="/favicon.ico?v=16" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg?v=16" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- สีแถบเบราว์เซอร์บนมือถือ = สีประจำแอป -->
    <meta name="theme-color" content="#182031" />
    <meta
      name="description"
      content="TidTam (ติดตาม) — ระบบติดตามงานภาคสนามครบวงจร: จัดตารางช่าง · ติดตามการดำเนินงาน · เอกสาร · วางบิล · เบิกค่าใช้จ่าย"
    />
    <link rel="apple-touch-icon" href="/app-icon-apple-180.png?v=16" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      🐛 BUG ที่แก้ (ตัวหนาทุกจุดในแอปเบลอ/เละ + ตัวอักษรไทยเป็นฟอนต์อะไรก็ไม่รู้):
      เดิมโหลด Montserrat มาแค่ "น้ำหนักเดียว" (wght@500) แต่โค้ดทั้งแอปใช้ fontWeight 600/700/800
      อยู่กว่า 180 จุด — เบราว์เซอร์จึงต้อง "ปลอมตัวหนา" (faux bold) ให้เองด้วยการรีดตัวอักษรน้ำหนัก
      500 ให้อ้วนขึ้น ผลคือหัวข้อ/ตัวเลขทุกจุดดูเบลอและขอบไม่คม
      ซ้ำร้ายกว่านั้น: Montserrat "ไม่มีตัวอักษรไทยเลยสักตัว" — ข้อความไทยซึ่งเป็นเกือบทั้งแอปจึงตกไปใช้
      ฟอนต์สำรองของระบบปฏิบัติการ (คนละแบบกันทุกเครื่อง/ทุกมือถือ) แปลว่าหน้าตาแอปที่เห็นจริงไม่เคย
      ถูกควบคุมเลย
      ✅ เปลี่ยนเป็น IBM Plex Sans Thai — ออกแบบมาสำหรับ UI/ตารางข้อมูลโดยเฉพาะ อ่านง่ายแม้ตัวเล็ก
      ไทยกับอังกฤษเป็นชุดเดียวกันจึงเข้ากันสนิท และโหลดครบทุกน้ำหนักที่โค้ดใช้จริง (400/500/600/700)
      ⚠️ IBM Plex Sans Thai ไม่มีน้ำหนัก 800 — ระบุ 700 เป็นตัวหนาสุด แล้วจุดที่โค้ดขอ 800 เบราว์เซอร์
      จะ map ลงมาที่ 700 ให้เอง (ยังคมชัดจริง ไม่ใช่ตัวปลอม) ดูคอมเมนต์ที่ src/index.css ประกอบ
    -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="/manifest.json" />
    <!--
      ⚠️ ไฟล์นี้ย้ายมาจาก public/index.html ตอนเปลี่ยนจาก Create React App มาเป็น Vite
      Vite ใช้ index.html ที่ราก project เป็น "จุดเริ่มต้นจริง" ของแอป (ไม่ใช่แค่เทมเพลต) จึงต้องอยู่ที่นี่
      และต้องมี <script type="module"> ชี้ไปที่ไฟล์ entry เองอย่างชัดเจน
      ส่วน %PUBLIC_URL% เป็นไวยากรณ์ของ CRA ที่ Vite ไม่รู้จัก — เปลี่ยนเป็น / ตรงๆ ทั้งหมด
      (ไฟล์ใน public/ ยังถูกเสิร์ฟที่ราก / เหมือนเดิม เช่น /favicon.ico, /manifest.json, /push-sw.js)
    -->
    <style>@keyframes tt-spin { to { transform: rotate(360deg); } }</style>
    <title>TidTam · ติดตามทุกงานจนจบ</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- ✅ splash ก่อน JS โหลดเสร็จ (เดิมจอขาวเปล่า) — หน้าตาเดียวกับ PageLoader แบบ fullscreen
         (src/shared/ui/PageLoader.js) React แทนที่ทั้งก้อนเองตอน render ครั้งแรก
         ⚠️ ขนาด/ตำแหน่งใส่เป็น inline style ทั้งหมด — ห้ามพึ่ง CSS ที่โหลดทีหลัง (ไม่งั้นโลโก้ขึ้นขนาดเต็ม 592px ชิดมุมซ้าย) -->
    <div id="root">
      <div role="status" aria-label="กำลังเปิดระบบ" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#f8fafc;font-family:'IBM Plex Sans Thai',system-ui,sans-serif">
        <img src="/app-wordmark-dark.png?v=16" alt="TidTam" width="168" style="display:block;width:168px;max-width:70vw;height:auto" />
        <span style="display:block;width:30px;height:30px;box-sizing:border-box;border-radius:50%;border:3px solid #e2e8f0;border-top-color:#2563eb;animation:tt-spin .8s linear infinite"></span>
        <div style="font-size:13.5px;font-weight:600;color:#64748b">กำลังเปิดระบบ…</div>
      </div>
    </div>
    <!-- ✅ (21 ต.ค. 2569 ผู้ใช้: "อัปขึ้น production แล้วเปิดแอปค้างหน้ากำลังเปิดระบบ") ตัวช่วยกู้หน้าค้าง + เก็บสาเหตุ
         • เก็บ error ที่เกิดตั้งแต่เริ่มโหลด (ก่อน React ทำงาน)
         • ผ่านไป 15 วินาทียังค้างที่ "กำลังเปิดระบบ…" → แสดงกล่องบอกสาเหตุ + ปุ่ม "โหลดใหม่" / "ล้างแคชแล้วเปิดใหม่" (ยังล็อกอินอยู่)
         ⚠️ สคริปต์ธรรมดา (ไม่ใช่ module) — ต้องทำงานได้แม้ไฟล์แอปหลักโหลด/รันไม่ผ่าน -->
    <script>
      (function () {
        var errs = [];
        window.__ttBootErrors = errs;
        window.addEventListener("error", function (e) {
          if (!e || /ResizeObserver/.test(e.message || "")) return;
          var where = e.filename ? " @" + String(e.filename).split("/").pop() + ":" + e.lineno : (e.target && e.target.src ? " @" + e.target.src.split("/").pop() : "");
          errs.push((e.message || "โหลดไฟล์ไม่สำเร็จ") + where);
        }, true);
        window.addEventListener("unhandledrejection", function (e) {
          var r = e && e.reason;
          errs.push("Promise: " + String((r && (r.message || r)) || "").slice(0, 300));
        });
        setTimeout(function () {
          var root = document.getElementById("root");
          if (!root || String(root.innerText || "").indexOf("กำลังเปิดระบบ") === -1) return;
          var box = document.createElement("div");
          box.setAttribute("style", "position:fixed;left:12px;right:12px;bottom:16px;z-index:99999;background:#fff;border:1px solid #fecaca;border-radius:14px;padding:14px;box-shadow:0 10px 30px rgba(15,23,42,.18);font-family:system-ui,sans-serif");
          var list = errs.slice(-4).map(function (x) { return "<div style='margin-top:4px;font-size:11px;color:#b91c1c;word-break:break-all'>• " + String(x).replace(/</g, "&lt;") + "</div>"; }).join("");
          box.innerHTML = "<div style='font-weight:800;font-size:14px;color:#0f172a'>เปิดระบบนานผิดปกติ</div>"
            + "<div style='font-size:12px;color:#64748b;margin-top:2px'>" + (errs.length ? "พบข้อผิดพลาด (แคปหน้าจอนี้ส่งให้ผู้ดูแล):" : "ยังไม่พบข้อผิดพลาด — อาจเป็นเน็ตช้าหรือเซิร์ฟเวอร์กำลังเริ่มทำงาน") + "</div>" + list
            + "<div style='display:flex;gap:8px;margin-top:12px'>"
            + "<button id='tt-boot-reload' style='flex:1;height:40px;border:1px solid #e2e8f0;border-radius:10px;background:#fff;font-weight:700'>โหลดใหม่</button>"
            + "<button id='tt-boot-clear' style='flex:1.4;height:40px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:800'>ล้างแคชแล้วเปิดใหม่</button></div>";
          document.body.appendChild(box);
          document.getElementById("tt-boot-reload").onclick = function () { location.reload(); };
          document.getElementById("tt-boot-clear").onclick = function () {
            var jobs = [];
            try { sessionStorage.clear(); } catch (e) {}
            try {
              // ล้างค่าที่แอปจำไว้ (ยกเว้นการล็อกอิน) — ค่าเก่าที่เสียอาจทำให้เปิดไม่ขึ้น
              var keep = { token: 1, payload: 1 };
              Object.keys(localStorage).forEach(function (k) { if (!keep[k]) localStorage.removeItem(k); });
            } catch (e) {}
            if (window.caches && caches.keys) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
            Promise.all(jobs).catch(function () {}).then(function () { location.replace("/dashboard?fresh=" + Date.now()); });
          };
        }, 15000);
      })();
    </script>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 289 73" width="289" height="73" role="img" aria-label="Flowix โฟลวิกซ์">
  <!--
    โลโก้ Flowix แบบตัวอักษรล้วน — ใช้ในแอป (แถบบน · หน้าเข้าสู่ระบบ)
    "Flow" ใช้ currentColor จึงอ่านออกทั้งพื้นเข้มและพื้นสว่าง · "ix" ไล่เฉดสีแบรนด์ แดง -> พลัม
    ⚠️ ไม่มีกรอบพื้นหลัง (ผู้ใช้สั่งตัดออก) — ไอคอนแบบมีกรอบอยู่ที่ app-icon.svg สำหรับหน้าจอโฮม
    ⚠️ เป็นเครื่องหมายของ "แอป" เท่านั้น ไม่ใช่โลโก้บริษัท (โลโก้บริษัทตั้งจากหน้า "ตั้งค่าองค์กร")
    ⚠️ ไฟล์นี้สร้างจากสคริปต์ make-brand.js — แก้ที่สคริปต์แล้วรันใหม่ อย่าแก้มือทีละไฟล์
  -->
  <defs>
    <linearGradient id="nxWord" gradientUnits="userSpaceOnUse"
      x1="214" y1="64" x2="283" y2="17.5">
      <stop offset="0" stop-color="#fb4b5c"/>
      <stop offset=".55" stop-color="#dc2626"/>
      <stop offset="1" stop-color="#a21caf"/>
    </linearGradient>
  </defs>
  <text x="5" y="64" font-family="'Michroma','Space Grotesk',system-ui,sans-serif"
        font-size="75" font-weight="400" letter-spacing="-3.409090909090909">
    <tspan fill="currentColor">Flow</tspan><tspan fill="url(#nxWord)">ix</tspan>
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 76" width="240" height="76" role="img" aria-label="WiRix ไวริกซ์">
  <!--
    โลโก้ WiRix แบบตัวอักษรล้วน — ใช้ในแอป (แถบบน · หน้าเข้าสู่ระบบ)
    "WiR" ใช้ currentColor จึงอ่านออกทั้งพื้นเข้มและพื้นสว่าง · "ix" ไล่เฉดสีแบรนด์ แดง -> พลัม
    ⚠️ ไม่มีกรอบพื้นหลัง (ผู้ใช้สั่งตัดออก) — ไอคอนแบบมีกรอบอยู่ที่ app-icon.svg สำหรับหน้าจอโฮม
    ⚠️ เป็นเครื่องหมายของ "แอป" เท่านั้น ไม่ใช่โลโก้บริษัท (โลโก้บริษัทตั้งจากหน้า "ตั้งค่าองค์กร")
    ⚠️ ไฟล์นี้สร้างจากสคริปต์ make-brand.js — แก้ที่สคริปต์แล้วรันใหม่ อย่าแก้มือทีละไฟล์
  -->
  <defs>
    <linearGradient id="nxWord" gradientUnits="userSpaceOnUse"
      x1="160" y1="66" x2="235" y2="19.5">
      <stop offset="0" stop-color="#fb4b5c"/>
      <stop offset=".55" stop-color="#dc2626"/>
      <stop offset="1" stop-color="#a21caf"/>
    </linearGradient>
  </defs>
  <text x="5" y="66" font-family="'Sniglet',system-ui,sans-serif"
        font-size="75" font-weight="800" letter-spacing="0">
    <tspan fill="currentColor">WiR</tspan><tspan fill="url(#nxWord)">ix</tspan>
  </text>
</svg>

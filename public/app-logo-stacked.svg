<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 292 76" width="292" height="76" role="img" aria-label="TidTam ติดตาม">
  <!--
    โลโก้เต็มชุด (เครื่องหมาย + ชื่อ + คำไทย)
    ⚠️ ไฟล์นี้ถูกสร้างจากสคริปต์ scripts/make-brand.js — ห้ามแก้ด้วยมือ (รันใหม่แล้วทับทันที)
    ⚠️ เป็นเครื่องหมายของ "แอป" เท่านั้น ไม่ใช่โลโก้บริษัท (โลโก้บริษัทตั้งจากหน้า "ตั้งค่าองค์กร")
  -->
  <g transform="translate(0 6)"><g transform="translate(0 -2.5)">
  <rect x="8" y="14" width="30" height="9" rx="2.5" fill="#0f172a"/>
  <rect x="18.5" y="14" width="9" height="36" rx="2.5" fill="#0f172a"/>
  <rect x="26" y="24" width="30" height="9" rx="2.5" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" paint-order="stroke"/>
  <rect x="36.5" y="24" width="9" height="22" rx="2.5" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" paint-order="stroke"/>
  <rect x="26" y="24" width="30" height="9" rx="2.5" fill="#dc2626"/>
  <circle cx="41" cy="46" r="9" fill="#ffffff"/>
  <path d="M36.5 46.2 l3.2 3.2 5.8-6.2" fill="none" stroke="#dc2626" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></g></g>
  <text x="78" y="43" font-family="'Poppins', system-ui, sans-serif" font-size="40" font-weight="800" letter-spacing="-1">
    <tspan fill="currentColor">Tid</tspan><tspan fill="#dc2626">Tam</tspan>
  </text>
  <text x="80" y="63" font-family="'IBM Plex Sans Thai', system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="4.6" fill="#64748b">ติดตาม</text>
</svg>
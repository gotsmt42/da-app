<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 296 76" width="296" height="76" role="img" aria-label="TidTam ติดตาม">
  <!--
    โลโก้เต็มชุด (เครื่องหมาย + ชื่อ + คำไทย) — ใช้ที่แผงใหญ่
    ⚠️ ไฟล์นี้ถูกสร้างจากสคริปต์ scripts/make-brand.js — ห้ามแก้ด้วยมือ (รันใหม่แล้วทับทันที)
    ⚠️ เป็นเครื่องหมายของ "แอป" เท่านั้น ไม่ใช่โลโก้บริษัท (โลโก้บริษัทตั้งจากหน้า "ตั้งค่าองค์กร")
  -->
  <defs>
    <linearGradient id="ttIcon2" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ef4444"/><stop offset="1" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="ttWord2" gradientUnits="userSpaceOnUse" x1="204" y1="46" x2="290" y2="12">
      <stop offset="0" stop-color="#fb4b5c"/><stop offset=".55" stop-color="#dc2626"/><stop offset="1" stop-color="#a21caf"/>
    </linearGradient>
  </defs>
  <g transform="translate(0 6)">
    <rect width="64" height="64" rx="15" fill="url(#ttIcon2)"/>
    
  <path d="M32 12 A20 20 0 1 0 49 22" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <circle cx="32" cy="12" r="4.6" fill="#ffffff"/>
  <path d="M23 32.5 L29.5 39 L42 25" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="78" y="43" font-family="'IBM Plex Sans Thai', system-ui, sans-serif" font-size="40" font-weight="700" letter-spacing="-.5">
    <tspan fill="currentColor">Tid</tspan><tspan fill="url(#ttWord2)">Tam</tspan>
  </text>
  <text x="80" y="63" font-family="'IBM Plex Sans Thai', system-ui, sans-serif" font-size="15" font-weight="600" letter-spacing="3.4" fill="#64748b">ติดตาม</text>
</svg>
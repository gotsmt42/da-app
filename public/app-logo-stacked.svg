<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 232" width="320" height="232" role="img" aria-label="PlanNgan แผนงาน">
  <!--
    โลโก้แอปแบบเรียงแนวตั้ง — ใช้ตรงที่มีพื้นที่สูงและวางกลางจอ (หน้าเข้าสู่ระบบ)
    ⚠️ สัดส่วนเกือบจัตุรัส ตั้งใจให้ใส่ในช่องที่กำหนดความสูงไว้แล้วไม่ล้นออกด้านข้าง
       (แบบแนวนอน app-wordmark.svg จะกว้างเกินไปถ้าเอาไปตั้งความสูงเท่ากัน)
    ⚠️ ตัวหนังสือใช้ currentColor — พื้นเข้มตั้ง color ขาว พื้นสว่างตั้ง color เข้ม
  -->
  <rect x="112" y="8" width="96" height="96" rx="22" fill="#dc2626"/>
  <g transform="translate(112 8) scale(1.5)" fill="none" stroke="#ffffff"
     stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 50 V14 H32 A8 8 0 0 1 32 30 H20"/>
    <path d="M31 43 L37 49 L54 29"/>
  </g>
  <text x="160" y="160" text-anchor="middle" fill="currentColor"
        font-family="'IBM Plex Sans Thai','IBM Plex Sans',system-ui,sans-serif"
        font-size="40" font-weight="700" letter-spacing="-0.8">PlanNgan</text>
  <text x="160" y="190" text-anchor="middle" fill="currentColor" opacity="0.62"
        font-family="'IBM Plex Sans Thai',system-ui,sans-serif"
        font-size="16" font-weight="500">แผนงาน · ระบบงานบริการหน้างาน</text>
</svg>

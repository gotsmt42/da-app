<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 162 39" width="162" height="39" role="img" aria-label="NexPlan เน็กซ์แพลน">
  <!--
    โลโก้ NexPlan แบบตัวอักษรล้วน — ใช้ในแอป (แถบบน · หน้าเข้าสู่ระบบ)
    "Nex" ใช้ currentColor จึงอ่านออกทั้งพื้นเข้มและพื้นสว่าง · "Plan" ไล่เฉดสีแบรนด์ แดง -> ม่วง
    ⚠️ ไม่มีกรอบพื้นหลัง (ผู้ใช้สั่งตัดออก) — ไอคอนแบบมีกรอบอยู่ที่ app-icon.svg สำหรับหน้าจอโฮม
    ⚠️ เป็นเครื่องหมายของ "แอป" เท่านั้น ไม่ใช่โลโก้บริษัท (โลโก้บริษัทตั้งจากหน้า "ตั้งค่าองค์กร")
    ⚠️ ไฟล์นี้สร้างจากสคริปต์ make-brand.js — แก้ที่สคริปต์แล้วรันใหม่ อย่าแก้มือทีละไฟล์
  -->
  <defs>
    <linearGradient id="nxWord" gradientUnits="userSpaceOnUse"
      x1="76" y1="34" x2="159" y2="7.960000000000001">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset=".45" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <text x="3" y="34" font-family="'Space Grotesk','IBM Plex Sans',system-ui,sans-serif"
        font-size="42" font-weight="700" letter-spacing="-1">
    <tspan fill="currentColor">Nex</tspan><tspan fill="url(#nxWord)">Plan</tspan>
  </text>
</svg>

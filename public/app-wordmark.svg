<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 148 42" width="148" height="42" role="img" aria-label="TidTam ติดตาม">
  <!--
    โลโก้ตัวอักษรล้วน — ใช้บนแถบบนและการ์ดฟอร์ม
    ⚠️ ไฟล์นี้ถูกสร้างจากสคริปต์ scripts/make-brand.js — ห้ามแก้ด้วยมือ (รันใหม่แล้วทับทันที)
    ⚠️ เป็นเครื่องหมายของ "แอป" เท่านั้น ไม่ใช่โลโก้บริษัท (โลโก้บริษัทตั้งจากหน้า "ตั้งค่าองค์กร")
  -->
  <text x="2" y="33" font-family="'Poppins', system-ui, sans-serif" font-size="38" font-weight="800" letter-spacing="-1">
    <tspan fill="currentColor">Tid</tspan><tspan fill="#dc2626">Tam</tspan>
  </text>
</svg>
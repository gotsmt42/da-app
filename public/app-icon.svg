<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Flowix โฟลวิกซ์">
  <!--
    ไอคอนแอป Flowix — ใช้บนหน้าจอโฮม/แท็บเบราว์เซอร์ (ที่ที่ต้องเป็นสี่เหลี่ยมจัตุรัสมีพื้น)
    แนวคิด: ตัว F เอียงไปข้างหน้า + สายธารสองเส้นไหลออกไปทางขวา
    = Flow (งานไหลลื่น ไม่สะดุด) + ix (ลงท้ายแบบซอฟต์แวร์ยุคใหม่) -> งานและข้อมูลไหลเชื่อมโยงกัน
    ⚠️ ตัวอักษรต้องเป็นชิ้นเดียวไม่ขาดตอน — เคยผ่าด้วยรอยทแยงแล้วเอาออก เพราะอ่านเป็น
       "ตัดขาด/สะดุด" ซึ่งค้านกับความหมายของชื่อแบรนด์
    ⚠️ ในแอปไม่ได้ใช้ไฟล์นี้ — แถบบน/หน้าเข้าสู่ระบบใช้แบบตัวอักษรล้วน (app-wordmark-*.png)
    ⚠️ เป็นเครื่องหมายของ "แอป" เท่านั้น ไม่ใช่โลโก้บริษัท
    ⚠️ ไฟล์นี้สร้างจากสคริปต์ make-brand.js — แก้ที่สคริปต์แล้วรันใหม่ อย่าแก้มือทีละไฟล์
  -->
  <defs>
    <linearGradient id="nxTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8324a"/>
      <stop offset=".55" stop-color="#b91c1c"/>
      <stop offset="1" stop-color="#831843"/>
    </linearGradient>
    <linearGradient id="nxBeam" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#nxTile)"/>
  <path d="M6 46 L28 10" stroke="url(#nxBeam)" stroke-width="9" stroke-linecap="round"/>
  <g transform="translate(-3 2) scale(0.9) skewX(-7) translate(4 0)">
    <path d="M15 15 H44 V23 H23.5 V28 H39 V36 H23.5 V49 H15 Z" fill="#ffffff"/>
  </g>
  <path d="M33 42 C43 42 41 28 51 26" fill="none" stroke="#ffffff" stroke-width="4.6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M33 51 C46 51 45 34 56 32" fill="none" stroke="#ffffff" stroke-width="4.6"
        stroke-linecap="round" stroke-linejoin="round" opacity=".45"/>
</svg>

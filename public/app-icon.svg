<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="TidTam ติดตาม">
  <!--
    ไอคอนแอป
    ⚠️ ไฟล์นี้ถูกสร้างจากสคริปต์ scripts/make-brand.js — ห้ามแก้ด้วยมือ (รันใหม่แล้วทับทันที)
    ⚠️ เป็นเครื่องหมายของ "แอป" เท่านั้น ไม่ใช่โลโก้บริษัท (โลโก้บริษัทตั้งจากหน้า "ตั้งค่าองค์กร")
  -->
  <defs>
    <linearGradient id="tt" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ef4444"/><stop offset="1" stop-color="#991b1b"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#tt)"/>
  <g transform="translate(0 0) scale(1.0000)">
  <path d="M32 12 A20 20 0 1 0 49 22" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <circle cx="32" cy="12" r="4.6" fill="#ffffff"/>
  <path d="M23 32.5 L29.5 39 L42 25" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="PlanNgan แผนงาน">
  <!--
    ไอคอนแอป PlanNgan (แผนงาน)
    แนวคิด: ตัว P ของชื่อแอป + เครื่องหมายถูกที่พุ่งขึ้น = "แผนงานที่ปิดจบได้จริง"
    ⚠️ นี่คือเครื่องหมายของ "แอป" เท่านั้น — โลโก้บริษัท (logo-letterhead / stamp / โลโก้ในตั้งค่าองค์กร) ไม่เกี่ยวกัน
    ⚠️ เส้นหนา 6 บนกริด 64 และเว้นช่องไฟระหว่างท้อง P กับเครื่องหมายถูกไว้ ~7 หน่วย
       เพื่อให้ย่อเหลือ 16px แล้วสองรูปยังไม่เชื่อมติดกันเป็นก้อนเดียว
  -->
  <rect width="64" height="64" rx="15" fill="#dc2626"/>
  <g fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- ตัว P: ขาตั้ง + ท้องตัวอักษร -->
    <path d="M20 50 V14 H32 A8 8 0 0 1 32 30 H20"/>
    <!-- เครื่องหมายถูก -->
    <path d="M31 43 L37 49 L54 29"/>
  </g>
</svg>
